services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-nestest-backend}
    env_file:
      - .env
    environment:
      # En producción el ConfigService lee process.env (no el archivo .env).
      NODE_ENV: production
      # Dentro de la red de Docker la DB se alcanza por el nombre del servicio.
      DB_HOST: postgres
      # El puerto interno del contenedor de Postgres siempre es 5432;
      # DB_PORT del .env se usa solo para el mapeo al host.
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-5002}:${APP_PORT:-5002}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-2}"
          memory: "${APP_MEM_LIMIT:-512MB}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${APP_PORT:-5002}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-nestest-postgres}
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_DATABASE:-restaurant_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT:-2}"
          memory: "${DB_MEM_LIMIT:-512MB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-restaurant_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
